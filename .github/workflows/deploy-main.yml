# Deploy automático para produção (main)
name: Deploy Backend - Production

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Maven
        working-directory: ./backend
        run: mvn clean package -DskipTests

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4047297861444578A2A4BCD3FCCE9257 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_82A86EB420404E07863EFFB5C4A30DFC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D4952136FAAD4C8FB3D55024B0A3BC56 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'skillify'
          slot-name: 'Production'
          package: './backend/target/habilidades-api.jar'
