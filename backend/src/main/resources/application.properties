# ==========================================
# Configuração da Aplicação Jakarta EE
# Catálogo de Habilidades API
# ==========================================
# 
# Esta aplicação usa Jakarta EE com Grizzly HTTP Server
# As configurações são feitas através de:
# - Variáveis de ambiente para configurações dinâmicas
# - Código Java para configuração de recursos
#
# ==========================================
# Variáveis de Ambiente Necessárias
# ==========================================
# ORACLE_CONNECT_STRING=localhost:1521/XE
# ORACLE_USER=seu_usuario
# ORACLE_PASSWORD=sua_senha
# JWT_SECRET=sua-chave-secreta-super-forte-altere-em-producao
# JWT_EXPIRATION=604800000 (opcional, padrão: 7 dias em milissegundos)
#
# ==========================================
# Formato da URL JDBC Oracle:
# ==========================================
# - Para SID: jdbc:oracle:thin:@host:port:sid
# - Para Service Name: jdbc:oracle:thin:@//host:port/service_name
# IMPORTANTE: Se usar service name (contém /), a URL deve ter // após o @
# Exemplo: ORACLE_CONNECT_STRING=oracle.fiap.com.br:1521/orcl
#          URL resultante: jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl
#
# ==========================================
# Nota sobre Logging
# ==========================================
# O logging deve ser configurado no servidor de aplicação
# (WildFly, GlassFish, Payara, TomEE, etc.)

