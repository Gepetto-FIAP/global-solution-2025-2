# ==========================================
# Configuração da Aplicação Spring Boot
# Catálogo de Habilidades API
# ==========================================

# Porta do servidor
server.port=8080

# ==========================================
# Configuração do Banco de Dados Oracle
# ==========================================
# Formato da URL JDBC Oracle:
# - Para SID: jdbc:oracle:thin:@host:port:sid
# - Para Service Name: jdbc:oracle:thin:@//host:port/service_name
# IMPORTANTE: Se usar service name (contém /), a URL deve ter // após o @
# Exemplo: ORACLE_CONNECT_STRING=oracle.fiap.com.br:1521/orcl
#          URL resultante: jdbc:oracle:thin:@//oracle.fiap.com.br:1521/orcl
spring.datasource.url=jdbc:oracle:thin:@//${ORACLE_CONNECT_STRING:localhost:1521/XE}
spring.datasource.username=${ORACLE_USER}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# Configuração do JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Configuração JWT
# ==========================================
jwt.secret=${JWT_SECRET:seu-secret-super-secreto-mude-isso-em-producao}
jwt.expiration=604800000

# ==========================================
# Logging
# ==========================================
logging.level.com.catalogo.habilidades=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN

